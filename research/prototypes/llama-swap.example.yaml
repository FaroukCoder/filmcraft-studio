# llama-swap config for one 12 GB GPU shared by Hermes, Reel Brain, Creative Studio and
# ComfyUI (Top 10 #2). Only one member of the "gpu" group runs at a time; asking for
# another unloads the current one first.
#
# Install (community-maintained WinGet package):  winget install llama-swap
# Run:   llama-swap --config llama-swap.yaml --listen 127.0.0.1:8080
# Then point every client at http://127.0.0.1:8080/v1 with the model id below,
# and open ComfyUI at http://127.0.0.1:8080/comfyui/ (reserved id `comfyui_auto`).
#
# Paths, file names and flags are placeholders: check `llama-server --help` for your
# build. llama.cpp's Windows CUDA zip needs the matching cudart zip (the CUDA DLLs)
# unpacked into the same folder; the cuda-12.4 build runs on older drivers than cuda-13.x. Not tested on Windows by me;
# keys follow llama-swap's own config.example.yaml (October 2026).

macros:
  "llama": >-
    C:/ai/llama.cpp/llama-server.exe
    --host 127.0.0.1 --port ${PORT}
    -ngl 999 --jinja

models:
  # Hermes daily driver (needs ~32 GB system RAM for the offloaded experts).
  # Recent llama.cpp builds fit expert offload to free VRAM by themselves (`--fit`, on by
  # default); the 1.5 GB margin leaves room for the Windows desktop. Read the log line
  # that reports what it offloaded; if it picks badly, replace the two --fit flags with
  # a fixed --n-cpu-moe: 3060 owners report their best at 24 (38.9 tok/s, Q4_K_M) and 26
  # (~45 tok/s, UD-Q4_K_XL), which matches my arithmetic for 64K context on 12 GB.
  # 64K context is cheap here: only 10 of the 40 layers keep a KV cache (~1.3 GB at f16).
  # -np 1: one slot, so the KV cache isn't sized for parallel requests you don't make.
  "agent":
    cmd: |
      ${llama}
      -m C:/ai/models/Qwen3.6-35B-A3B-Q4_K_M.gguf
      --fit on --fit-target 1536
      -c 65536 -np 1
      --chat-template-file C:/ai/templates/qwen3.6.jinja
      # uncomment to let the agent read images (planner, defect checks); the projector
      # must be Qwen3.6's own, Qwen3.5 projectors don't fit
      # --mmproj C:/ai/models/mmproj-Qwen3.6-35B-A3B-BF16.gguf
    ttl: 900

  # Fallback daily driver if RAM is 16 GB: dense, fully on the GPU.
  "agent-small":
    cmd: |
      ${llama}
      -m C:/ai/models/Qwen3.5-9B-Q5_K_M.gguf
      -c 65536 -np 1
      # Qwen3.5 is multimodal: uncomment with the projector from the same GGUF repo for images
      # --mmproj C:/ai/models/mmproj-Qwen3.5-9B-F16.gguf
    ttl: 900

  # The challenger in Day 4's replay (Apache-2.0, native tool calls; ~8 GB at 16K by a VRAM
  # calculator, so expect more at 64K: lower -c if it doesn't fit). File names from
  # ggml-org/gemma-4-12B-GGUF; the ~175 MB projector lets it read frames too. Hermes can't probe the
  # context through llama-swap and guesses from the ID ("gemma" -> 8,192, which it refuses), so set
  # model.default to this name and keep model.context_length 65536 while you test it.
  "agent-gemma":
    cmd: |
      ${llama}
      -m C:/ai/models/gemma-4-12B-Q4_K_M.gguf
      -c 65536 -np 1
      # --mmproj C:/ai/models/mmproj-gemma-4-12B-f16.gguf
    ttl: 900

  # Vision for Reel Brain and Creative Studio defect checks. 4-bit quants loop more, but Q8 does
  # not fit: Q8_0 ~8.7 GB + projector ~1.2 GB + KV ~2.4 GB at 16K (36 layers x 8 KV heads x 128)
  # is over 12 GB. Q6_K at 8K context is ~9 GB; 8 frames at 360x640 are ~2K tokens.
  "vlm":
    cmd: |
      ${llama}
      -m C:/ai/models/Qwen3-VL-8B-Instruct-Q6_K.gguf
      --mmproj C:/ai/models/mmproj-Qwen3-VL-8B-Instruct-F16.gguf
      -c 8192 -np 1
    ttl: 300

  # A/B candidate: one benchmark author saw zero loops in 500 cases. ~9B: Q6_K, not Q8.
  "vlm-glm":
    cmd: |
      ${llama}
      -m C:/ai/models/GLM-4.6V-Flash-Q6_K.gguf
      --mmproj C:/ai/models/mmproj-GLM-4.6V-Flash-F16.gguf
      -c 8192 -np 1
    ttl: 300

  # Egyptian Arabic / code-switched speech: QwenCleo-ASR's own FastAPI server, which has an
  # OpenAI-style /v1/audio/transcriptions route (pip install -e . plus requirements-serving.txt
  # in C:/ai/qwencleo-asr). Text only: no word timings for Arabic, see the report (2.1).
  "asr-eg":
    cmd: >-
      C:/ai/qwencleo-asr/.venv/Scripts/python.exe -m uvicorn
      --app-dir C:/ai/qwencleo-asr server.app:app
      --host 127.0.0.1 --port ${PORT}
    checkEndpoint: /health
    ttl: 300

  # ComfyUI behind llama-swap: the id must be exactly comfyui_auto.
  "comfyui_auto":
    cmd: >-
      C:/ai/ComfyUI_windows_portable/python_embeded/python.exe -s
      C:/ai/ComfyUI_windows_portable/ComfyUI/main.py
      --listen 127.0.0.1 --port ${PORT}
    checkEndpoint: /
    ttl: 600
    unlisted: true

# DJ mode: dj_guard.py switches to this profile while Serato or Ableton runs. Every pin is
# null, so llama-swap answers each model with 404 instead of loading it onto the GPU.
# (The /comfyui/ route ignores profiles; the guard unloads anything that starts anyway.)
profiles:
  "dj":
    description: "Serato or Ableton is running: no GPU models"
    pins:
      "agent": ~
      "agent-small": ~
      "agent-gemma": ~
      "vlm": ~
      "vlm-glm": ~
      "asr-eg": ~
      "comfyui_auto": ~

routing:
  router:
    use: group
    settings:
      groups:
        "gpu":
          swap: true        # one member at a time
          exclusive: true   # loading a member unloads other groups too
          members: ["agent", "agent-small", "agent-gemma", "vlm", "vlm-glm", "asr-eg", "comfyui_auto"]
